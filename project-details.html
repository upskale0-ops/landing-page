<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details | Upskale Tech Digital</title>
  <style>
    :root {
      --bg: #070c0a;
      --bg-2: #0d1714;
      --panel: rgba(16, 25, 22, 0.9);
      --line: rgba(201, 169, 110, 0.12);
      --text: #edf7f1;
      --muted: rgba(237, 247, 241, 0.72);
      --gold: #c9a96e;
      --gold-soft: #e4d0a6;
      --teal: #58d1d5;
      --blue: #71c7f5;
      --orange: #ff6b2b;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(113, 199, 245, 0.08), transparent 25%),
        radial-gradient(circle at 80% 15%, rgba(201, 169, 110, 0.06), transparent 20%),
        linear-gradient(180deg, var(--bg) 0%, #09120f 32%, #050b09 100%);
      color: var(--text);
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    .container { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(7, 12, 10, 0.76);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 80px;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
    }

    .brand img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 50%;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .nav-links a {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(237, 247, 241, 0.75);
    }

    .nav-links a:hover,
    .nav-links a[aria-current="page"] { color: var(--gold); }

    .page {
      padding: 54px 0 32px;
    }

    .eyebrow {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 0.7rem;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      max-width: 880px;
      font-size: clamp(2.8rem, 6vw, 5.5rem);
      line-height: 0.96;
      letter-spacing: -0.05em;
    }

    .intro {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 26px;
      align-items: end;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 1.06rem;
      max-width: 700px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .stat {
      background: linear-gradient(180deg, rgba(17,24,21,0.9), rgba(13,18,16,0.8));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: 0 18px 36px rgba(0,0,0,0.12);
    }

    .stat-label {
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(237,247,241,0.6);
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 1.35rem;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .section {
      margin-top: 30px;
      padding-top: 12px;
    }

    .section-head {
      margin-bottom: 18px;
    }

    .section-head .tag {
      color: var(--gold);
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3rem);
      letter-spacing: -0.04em;
    }

    .panel {
      background: linear-gradient(180deg, rgba(14,23,20,0.96), rgba(12,18,16,0.84));
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 18px 44px rgba(0,0,0,0.12);
      padding: 28px 26px;
    }

    .two-col,
    .three-col,
    .list-grid,
    .process-grid,
    .role-grid {
      display: grid;
      gap: 18px;
    }

    .two-col { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three-col { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .list-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .process-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .role-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px 24px;
      background: rgba(255,255,255,0.015);
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1.22rem;
      letter-spacing: -0.03em;
    }

    .card p,
    .card li {
      color: var(--muted);
      font-size: 0.98rem;
      margin: 0;
    }

    .card ul {
      padding-left: 18px;
      margin: 0;
    }

    .card li + li { margin-top: 8px; }

    .callout {
      background: linear-gradient(135deg, rgba(255, 107, 43, 0.08), rgba(113, 199, 245, 0.08));
      border: 1px solid rgba(255, 107, 43, 0.2);
      border-radius: 20px;
      padding: 22px 24px;
      margin-top: 18px;
    }

    .callout strong {
      display: block;
      margin-bottom: 8px;
      color: var(--gold-soft);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .process-step {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
      align-content: start;
    }

    .step-index {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid rgba(201,169,110,0.2);
      color: var(--gold);
      background: rgba(201,169,110,0.04);
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 999px;
      border: 1px solid rgba(201,169,110,0.15);
      background: rgba(201,169,110,0.04);
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.68rem;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--orange) 0%, #ff8b5c 100%);
      border-color: transparent;
      box-shadow: 0 18px 30px rgba(255,107,43,0.22);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .gallery-item {
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: var(--panel);
      aspect-ratio: 16 / 10;
      cursor: zoom-in;
      transition: border-color 0.3s ease, transform 0.3s ease;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover,
    .gallery-item:focus-visible {
      border-color: var(--gold);
      transform: translateY(-4px);
      outline: none;
    }

    .gallery-item:hover img { transform: scale(1.04); }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 48px 16px;
      background: rgba(5, 11, 9, 0.92);
      backdrop-filter: blur(6px);
      cursor: zoom-out;
    }

    .lightbox[hidden] { display: none; }

    .lightbox img {
      max-width: min(1200px, 100%);
      max-height: 100%;
      border-radius: 14px;
      box-shadow: 0 24px 60px var(--shadow);
      cursor: default;
    }

    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(201,169,110,0.3);
      background: rgba(201,169,110,0.08);
      color: var(--text);
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
    }

    .lightbox-close:hover { border-color: var(--gold); color: var(--gold); }

    .footer {
      border-top: 1px solid var(--line);
      margin-top: 48px;
      padding: 36px 0 64px;
      text-align: center;
      color: rgba(237,247,241,0.7);
    }

    @media (max-width: 900px) {
      .intro,
      .two-col,
      .three-col,
      .list-grid,
      .process-grid,
      .role-grid {
        grid-template-columns: 1fr;
      }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .panel { padding: 18px 16px; }
      .card { padding: 20px 18px; }
      .nav {
        flex-direction: column;
        justify-content: center;
        padding: 18px 0;
      }
      .nav-links { justify-content: center; gap: 12px 18px; }
      .stats { grid-template-columns: 1fr; }
      .gallery { grid-template-columns: 1fr; }
    }
  </style>
</head>

    const lightboxImg = lightbox.querySelector('img');
    const closeLightbox = () => { lightbox.hidden = true; lightboxImg.src = ''; };

    document.querySelectorAll('.gallery-item').forEach(item => {
      item.addEventListener('click', () => {
        lightboxImg.src = item.dataset.src;
        lightboxImg.alt = item.querySelector('img').alt;
        lightbox.hidden = false;
        lightbox.querySelector('.lightbox-close').focus();
      });
    });

    lightbox.addEventListener('click', e => { if (e.target !== lightboxImg) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lightbox.hidden) closeLightbox(); });
